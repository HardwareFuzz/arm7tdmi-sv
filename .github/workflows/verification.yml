name: verification

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  fail-hard-simulation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Historical FPGA evidence verifies the checker blobs at its pinned commit.
          fetch-depth: 0
      - name: Install open-source verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential clang curl lld llvm make \
            qemu-system-arm verilator xz-utils
      - name: Install pinned SystemVerilog frontend
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.tools"
          curl --fail --location \
            https://github.com/MikePopoloski/slang/releases/download/v11.0/slang-linux-x86_64.tar.gz \
            --output "$GITHUB_WORKSPACE/.tools/slang.tar.gz"
          echo "951a170e10e25e54c91565030acfdfc11c3226714ebf225a18ad4166a898d8a4  $GITHUB_WORKSPACE/.tools/slang.tar.gz" \
            | sha256sum --check -
          tar -xzf "$GITHUB_WORKSPACE/.tools/slang.tar.gz" \
            -C "$GITHUB_WORKSPACE/.tools"
          echo "$GITHUB_WORKSPACE/.tools" >> "$GITHUB_PATH"
      - name: Run fail-hard simulation regression
        run: make -C scripts regress-ci
      - name: Verify Rust ARM7 reference and random engine
        run: cargo test --locked --manifest-path verification/constrained_random_rs/Cargo.toml
      - name: Reproduce quick constrained-random gate
        run: make -C scripts random-validation-quick
      - name: Measure representative RTL coverage
        run: make -C scripts coverage
      - name: Validate and bundle immutable evidence
        run: make -C scripts release-evidence
      - name: Publish commit-addressed evidence
        uses: actions/upload-artifact@v4
        with:
          name: arm7tdmis-evidence-${{ github.sha }}
          path: |
            reports/generated/regression.json
            reports/generated/logs/
            reports/generated/coverage/
            reports/generated/trm-coverage-report.json
            reports/generated/ac-timing-report.json
            reports/generated/traceability-report.json
            reports/generated/independent-lint.json
            reports/generated/slang-*-diagnostics.json
            reports/generated/cdc-rdc.json
            reports/generated/constrained-random-report.json
            reports/generated/constrained_random/
            reports/generated/public-suite-report.json
            reports/generated/public_suite/
            reports/generated/release-manifest.json
            reports/generated/arm7tdmis-release-evidence-*.tar.gz
            reports/generated/arm7tdmis-release-evidence-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 90

  architectural-mutation:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install open-source verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential make verilator
      - name: Kill architectural-control mutants
        run: make -C scripts mutation-self-test

  formal:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned formal toolchain
        run: cargo run --release --locked --manifest-path verification/constrained_random_rs/Cargo.toml -- oss-cad-suite-install
      - name: Prove safety/liveness and close bounded covers
        run: make -C scripts formal
      - name: Preserve formal report, logs, and cover witnesses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm7tdmis-formal-${{ github.sha }}
          path: |
            reports/generated/formal-report.json
            reports/generated/formal/
          if-no-files-found: error
          retention-days: 90

  randomized-events:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install randomized-event verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential make verilator
      - name: Run all-class randomized external-event campaign
        run: make -C scripts random-events
      - name: Preserve event report and per-seed logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm7tdmis-random-events-${{ github.sha }}
          path: |
            reports/generated/random-events-report.json
            reports/generated/random_events/
          if-no-files-found: error
          retention-days: 90

  sanitizer-soak:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install sanitizer verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential make verilator
      - name: Run deterministic sanitizer and X-state soak
        run: make -C scripts soak
      - name: Preserve soak report and any minimized reproducer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm7tdmis-soak-${{ github.sha }}
          path: |
            reports/generated/soak-report.json
            reports/generated/soak-failures/
          if-no-files-found: error
          retention-days: 90
